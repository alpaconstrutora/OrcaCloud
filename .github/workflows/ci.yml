# ⚠️ NÃO EXISTE workflow de deploy nesta pasta — e a ausência dele NÃO significa
# que o projeto não publica sozinho.
#
# A publicação é a integração nativa do Vercel com o GitHub: um webhook do lado
# do Vercel, que não aparece em `.github/` nenhum. Push em `main` dispara build
# de PRODUÇÃO; push em qualquer outra branch dispara PREVIEW. Não há comando de
# deploy no fluxo normal.
#
# Isto está escrito aqui porque foi aqui que alguém procurou: em 06/09/2026 uma
# sessão viu só este arquivo, concluiu "chegar na main não publica nada", parou
# o trabalho numa branch sem PR e propôs `vercel deploy --prod` de uma pasta 151
# commits atrasada. Medido no mesmo dia, desmentindo a conclusão: 19:20 push em
# main, 19:32 o domínio servindo o commit novo, sem ninguém rodar deploy.
#
# Este CI roda EM PARALELO com o build do Vercel, não antes dele — ele não é
# portão de publicação. Quem barra o build é `vercel.json` → `buildCommand` →
# `npm run verificar:build`. Ver scripts/publicar-producao.sh e REGRA #8.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Sinks de HTML sem sanitizeHtml() (achados C5-01..C5-04 da auditoria de
      # 2026-09-01). Está aqui, e não na lembrança de quem revisa, pelo motivo
      # que o CLAUDE.md registra na REGRA #5: o script de verificação que
      # dependia de alguém rodar à mão foi a razão de aquele bug voltar.
      # As demais travas (segurancaMigrations, orgContextGuard) já são arquivos
      # de teste e entram no `vitest run` abaixo.
      - name: Sinks de XSS
        run: bash scripts/check-xss-sinks.sh

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npx vite build
