# ⚠️ NÃO EXISTE workflow de deploy nesta pasta — e a ausência dele NÃO significa
# que o projeto não publica sozinho.
#
# A publicação é a integração nativa do Vercel com o GitHub: um webhook do lado
# do Vercel, que não aparece em `.github/` nenhum. Push em `main` dispara build
# de PRODUÇÃO; push em qualquer outra branch não dispara build nenhum
# (`git.deploymentEnabled` no vercel.json). Não há comando de deploy no fluxo
# normal.
#
# Isto está escrito aqui porque foi aqui que alguém procurou: em 06/09/2026 uma
# sessão viu só este arquivo, concluiu "chegar na main não publica nada", parou
# o trabalho numa branch sem PR e propôs `vercel deploy --prod` de uma pasta 151
# commits atrasada. Medido no mesmo dia, desmentindo a conclusão: 19:20 push em
# main, 19:32 o domínio servindo o commit novo, sem ninguém rodar deploy.
#
# Este CI roda EM PARALELO com o build do Vercel, não antes dele — ele não é
# portão de publicação. Quem barra o build é `vercel.json` → `buildCommand` →
# `npm run verificar:build`. Ver scripts/publicar-producao.sh e REGRA #8.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Três jobs em PARALELO (20/11/2026). Antes era um só, em série, e levava 40–45 min
# em QUALQUER PR — até num PR só de `.md` (#598) — porque 12 arquivos de teste que
# geram a casa e o prédio inteiros somavam ~80 dos ~91 min de CPU da suíte. Esses
# 12 são o projeto `pesados` do Vitest (`TESTES_PESADOS` em `vite.config.ts`, onde
# está a medição e o porquê); o resto, `leves`.
env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  # 29/09/2026 (E4.3): o `tsc` do projeto passou de 4 GB de heap — com o padrão
  # do Node o processo caía (0xC0000005 no Windows, sem "heap out of memory").
  # Um teto explícito aqui e no script `typecheck`; o runner tem 7 GB.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  verificacoes:
    name: tsc, travas e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Sinks de HTML sem sanitizeHtml() (achados C5-01..C5-04 da auditoria de
      # 2026-09-01). Está aqui, e não na lembrança de quem revisa, pelo motivo
      # que o CLAUDE.md registra na REGRA #5: o script de verificação que
      # dependia de alguém rodar à mão foi a razão de aquele bug voltar.
      # As demais travas (segurancaMigrations, orgContextGuard) já são arquivos
      # de teste e entram nos testes `leves`, que rodam inteiros em todo PR.
      - name: Sinks de XSS
        run: bash scripts/check-xss-sinks.sh

      - name: Build
        run: npx vite build

  testes:
    name: testes (leves)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Testes leves
        run: npx vitest run --project leves --reporter=default --reporter=json --outputFile.json=relatorio-testes-leves.json

      # O tempo da CI não tinha dono: os pesados entraram um por fase na suíte que
      # roda sempre, e ninguém olhou o total. Arquivo de `leves` acima do teto
      # reprova aqui, com a instrução de movê-lo para TESTES_PESADOS.
      - name: Teto de tempo dos testes leves
        run: node scripts/check-tempo-dos-testes.mjs relatorio-testes-leves.json

  # Os pesados em DOIS passos: este escolhe QUAIS rodam; o de baixo roda cada um
  # num runner próprio. Num runner só, os 15 disputavam 4 vCPUs e o mais lento
  # ditava o tempo (o marco dos prédios, num arquivo só, 24,6 min — hoje dividido
  # por prédio, `predioAutomaticoMarcoComum.ts`).
  pesados-quais:
    name: testes (pesados) — quais rodam
    runs-on: ubuntu-latest
    outputs:
      arquivos: ${{ steps.quais.outputs.arquivos }}
    steps:
      # O `--changed` compara com a base por `git diff base...HEAD`, que precisa
      # do histórico (o merge-base). `fetch-depth: 0` FIXO: a versão condicional
      # (`pull_request && 0 || 1`) dava 1, porque 0 é falso nas expressões do
      # Actions — clone raso, base inexistente, e a 2ª CI do #603 "escolheu 0".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PR: só os pesados que importam (direta ou indiretamente) algum arquivo que
      # o PR mudou — pelo grafo de imports do Vitest, sem lista de pastas a manter.
      # PR que toca config, package*.json, a CI, setup ou fixtures escolhe todos
      # (`forceRerunTriggers` em vite.config.ts). PR sem nada disso, nenhum.
      # Push em main: todos, sempre — a rede de segurança da seleção. Ele não
      # atrasa ninguém: a publicação no Vercel não espera a CI.
      - name: Escolher os testes pesados
        id: quais
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            # O MESMO diff que o `--changed` faz, rodado aqui para FALHAR alto:
            # o Vitest ignora o código de saída do git, e um diff que falha vira
            # "nenhum arquivo mudou" — 0 pesados, verde, sem rodar nada.
            echo "PR: arquivos mudados desde $BASE_SHA:"
            git diff --name-only "$BASE_SHA...HEAD" | sed 's/^/  /'
            npx vitest list --filesOnly --project pesados --changed "$BASE_SHA" --json=pesados.json
          else
            echo "push em main: todos os pesados"
            npx vitest list --filesOnly --project pesados --json=pesados.json
          fi
          node -e '
            const raiz = process.cwd().replaceAll("\\", "/") + "/";
            const arquivos = require("./pesados.json").map((t) => t.file.replace(raiz, "")).sort();
            console.error(arquivos.length + " arquivo(s):\n  " + (arquivos.join("\n  ") || "(nenhum)"));
            console.log("arquivos=" + JSON.stringify(arquivos));
          ' >> "$GITHUB_OUTPUT"

  testes-pesados:
    name: pesado (${{ matrix.arquivo }})
    needs: pesados-quais
    if: needs.pesados-quais.outputs.arquivos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arquivo: ${{ fromJSON(needs.pesados-quais.outputs.arquivos) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Teste pesado
        env:
          ARQUIVO: ${{ matrix.arquivo }}
        run: npx vitest run --project pesados "$ARQUIVO"
