name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Sinks de HTML sem sanitizeHtml() (achados C5-01..C5-04 da auditoria de
      # 2026-09-01). Está aqui, e não na lembrança de quem revisa, pelo motivo
      # que o CLAUDE.md registra na REGRA #5: o script de verificação que
      # dependia de alguém rodar à mão foi a razão de aquele bug voltar.
      # As demais travas (segurancaMigrations, orgContextGuard) já são arquivos
      # de teste e entram no `vitest run` abaixo.
      - name: Sinks de XSS
        run: bash scripts/check-xss-sinks.sh

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npx vite build
