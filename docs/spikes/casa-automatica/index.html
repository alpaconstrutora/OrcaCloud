<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Harness — casa automática</title>
<style>
  html, body, #raiz { margin: 0; height: 100%; }
  /* Sem Tailwind aqui: o canvas precisa de container com tamanho real (ver harness ambiente-um-clique). */
  #raiz { display: flex; }
  #tela { position: relative; flex: 1 1 auto; }
  #tela > div { position: absolute; inset: 0; }
  canvas { display: block; }
  #dump { position: fixed; right: 0; bottom: 0; max-width: 36vw; max-height: 40vh;
          overflow: auto; font: 10px/1.3 monospace; background: #fff; opacity: .95; }
</style>
</head>
<body>
<div id="raiz"></div>
<pre id="dump"></pre>
<script type="module" src="./main.tsx"></script>
</body>
</html>
