<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Harness — conexão automática entre peças</title>
<style>
  html, body, #raiz { margin: 0; height: 100%; }
  /* O harness não carrega o Tailwind: sem tamanho por CSS, o container nasce com
     altura indefinida, a vista se enquadra nessa primeira medida e o passeio
     clica no vazio — zero geometria e zero erro no console. */
  #raiz > div { position: absolute; inset: 0; }
  canvas { display: block; }
  #dump { position: fixed; right: 0; bottom: 0; max-width: 40vw; max-height: 40vh;
          overflow: auto; font: 10px/1.3 monospace; background: #fff; opacity: .95; }
</style>
</head>
<body>
<div id="raiz"></div>
<pre id="dump"></pre>
<script type="module" src="./main.tsx"></script>
</body>
</html>
