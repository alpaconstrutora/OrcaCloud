<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Harness — encaixe no concreto</title>
<style>
  html, body, #raiz { margin: 0; height: 100%; }
  /* O harness não carrega o Tailwind, então `h-full w-full` do canvas não vale
     nada aqui e o container nasce com altura indefinida. A vista inicial é
     enquadrada na PRIMEIRA medida do container (e só nela), então um container
     que só ganha tamanho depois deixa o desenho fora da tela e o passeio clica
     no vazio. Dar tamanho por CSS simples resolve na origem. */
  #raiz > div { position: absolute; inset: 0; }
  canvas { display: block; }
  #dump { position: fixed; right: 0; bottom: 0; max-width: 40vw; max-height: 40vh;
          overflow: auto; font: 10px/1.3 monospace; background: #fff; opacity: .95; }
</style>
</head>
<body>
<div id="raiz"></div>
<pre id="dump"></pre>
<script type="module" src="./main.tsx"></script>
</body>
</html>
