<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Harness — juntar pontas soltas num canto</title>
<style>
  html, body, #raiz { margin: 0; height: 100%; }
  /* Sem Tailwind aqui, `h-full w-full` do container do canvas não vale nada, e a
     vista inicial é enquadrada na PRIMEIRA medida — container sem tamanho na hora
     certa deixa o desenho fora da tela. `#tela > div` alcança a raiz do próprio
     BlueprintCanvas. */
  #tela { position: absolute; inset: 0; }
  #tela > div { position: absolute; inset: 0; }
  canvas { display: block; }
  /* `pointer-events: none` não é detalhe: o mostrador cobre o canto inferior
     esquerdo do canvas — onde nasce o primeiro caso — e engoliria o clique do
     passeio sem erro nenhum no console. */
  #dump { position: fixed; left: 0; bottom: 0; max-width: 30vw; max-height: 40vh;
          overflow: hidden; font: 10px/1.3 monospace; background: rgba(255,255,255,.9);
          pointer-events: none; margin: 0; }
  #erro { position: fixed; left: 0; top: 0; max-width: 60vw; margin: 0; color: #b45309;
          font: 11px/1.4 monospace; background: rgba(255,255,255,.95); pointer-events: none; }
</style>
</head>
<body>
<div id="raiz"></div>
<pre id="dump"></pre>
<pre id="erro"></pre>
<script type="module" src="./main.tsx"></script>
</body>
</html>
