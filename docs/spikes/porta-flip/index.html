<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Harness — girar/espelhar porta</title>
<style>
  html, body, #raiz { margin: 0; height: 100%; }
  /* Sem Tailwind aqui, `h-full w-full` do container do canvas não vale nada, e
     a vista inicial é enquadrada na PRIMEIRA medida — container sem tamanho na
     hora certa deixa o desenho fora da tela. `#tela > div` alcança a raiz do
     próprio BlueprintCanvas, que é NETA de #raiz depois que o painel entrou. */
  #tela { position: absolute; inset: 0 260px 0 0; }
  #tela > div { position: absolute; inset: 0; }
  canvas { display: block; }
  /* `pointer-events: none` NÃO é detalhe: sem isso o mostrador cobre o canto
     inferior esquerdo do canvas — exatamente onde nasce a primeira parede — e
     engole o clique do passeio, que então "não seleciona nada" sem erro nenhum
     no console. Custou uma rodada de depuração. */
  #dump { position: fixed; left: 0; bottom: 0; max-width: 30vw; max-height: 30vh;
          overflow: hidden; font: 10px/1.3 monospace; background: rgba(255,255,255,.9);
          pointer-events: none; margin: 0; }
</style>
</head>
<body>
<div id="raiz"></div>
<pre id="dump"></pre>
<script type="module" src="./main.tsx"></script>
</body>
</html>
